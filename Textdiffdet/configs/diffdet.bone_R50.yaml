_BASE_: "Base-DiffusionDet.yaml"

MODEL:

  RESNETS:
    DEPTH: 50
    STRIDE_IN_1X1: False

  DiffusionDet:
    NUM_CLASSES: 1

    NUM_PROPOSALS: 500

    NUM_HEADS: 6


DATASETS:
  TRAIN: ("bone_train",)
  TEST: ("bone_val",)


SOLVER:

  OPTIMIZER: "SGD"

  BASE_LR: 0.0001


  MOMENTUM: 0.9


  WEIGHT_DECAY: 0.0001

  IMS_PER_BATCH: 4

  MAX_ITER: 200000

  STEPS: (120000, 180000)


  GAMMA: 0.1


  WARMUP_ITERS: 1000


  WARMUP_FACTOR: 0.01


  AMP:
    ENABLED: True


  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 1.0
    NORM_TYPE: 2.0

  CHECKPOINT_PERIOD: 10000


INPUT:
  FORMAT: "RGB"

  MIN_SIZE_TRAIN: (480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800)

  MAX_SIZE_TRAIN: 1333

  MIN_SIZE_TEST: 800
  MAX_SIZE_TEST: 1333

  CROP:
    ENABLED: False


TEST:
  EVAL_PERIOD: 1000

  AUG:
    ENABLED: False


MODEL_EMA:
  ENABLED: True
  DECAY: 0.9998


OUTPUT_DIR: "output/bone_exp"